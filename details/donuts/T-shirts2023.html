		<script>
			document.addEventListener('DOMContentLoaded', () => {
				const grids = document.querySelectorAll('.detail-media-grid');

				grids.forEach((grid) => {
					const images = grid.querySelectorAll('img');
					images.forEach((img) => {
						// 画像の本来の比率を計算して適用する関数
						const setRatio = () => {
							// 計算式：(横幅 ÷ 縦幅) を算出して flex-grow に設定！
							const ratio = img.naturalWidth / img.naturalHeight;
							img.style.flexGrow = ratio;

							// 完璧に高さを揃えるためにCSSのアスペクト比にも設定
							img.style.aspectRatio = ratio;
						};

						// 画像が既に読み込まれていればすぐ実行、まだなら読み込みを待ってから実行
						if (img.complete) {
							setRatio();
						} else {
							img.addEventListener('load', setRatio);
						}
					});
				});
			});
		</script>
